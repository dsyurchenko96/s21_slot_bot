repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [ python, pyi ]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [ python, pyi ]

      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest -n auto --cov=s21_slot_bot --cov-fail-under=95
        language: system
        pass_filenames: false
        stages: [ pre-commit ]
[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project]
name = "s21_slot_bot"
version = "1.0.0"
requires-python = ">= 3.14"
dependencies = [
    "anyio==4.12.1",
    "black==26.3.1",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.6",
    "click==8.3.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "mypy-extensions==1.1.0",
    "packaging==26.0",
    "pathspec==1.0.4",
    "platformdirs==4.9.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-telegram-bot==22.7",
    "pytokens==0.4.1",
    "requests==2.32.5",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]

[tool.black]
line-length = 120

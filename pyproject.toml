[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project]
name = "s21_slot_bot"
version = "1.0.0"
requires-python = ">= 3.14"
dependencies = [
    "anyio==4.13.0",
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.16",
    "mypy-extensions==1.1.0",
    "packaging==26.2",
    "pathspec==1.1.1",
    "platformdirs==4.9.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pytest>=9.0.3",
    "python-telegram-bot[job-queue]==22.7",
    "pytokens==0.4.1",
    "requests==2.34.2",
    "ruff==0.15.14",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
]

[tool.ruff]
line-length = 120
